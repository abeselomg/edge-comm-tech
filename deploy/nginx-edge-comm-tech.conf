# Edge Comm-Tech CMS.
#
# TLS is a self-signed certificate for now: no DNS record points at this host
# yet, so Let's Encrypt cannot validate it. The admin is a login form, and
# serving that over plain HTTP would put staff passwords and session cookies
# on the wire in cleartext -- a browser warning is the lesser problem. Once
# cms.edgecomm-tech.com resolves here, certbot replaces the certificate and
# rewrites these two paths; nothing else needs to change.

upstream edge_cms {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name cms.edgecomm-tech.com _;

    # Left reachable on port 80 so certbot's HTTP-01 challenge works later.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.18 takes http2 as a listen parameter; the standalone `http2 on;`
    # directive only exists from 1.25.1 and is a config error here.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name cms.edgecomm-tech.com _;

    ssl_certificate     /etc/ssl/edge-comm-tech/selfsigned.crt;
    ssl_certificate_key /etc/ssl/edge-comm-tech/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Payload accepts images and PDFs; nginx's 1m default rejects most of them
    # with a 413 that looks like the admin silently failing to save.
    client_max_body_size 25m;

    location / {
        proxy_pass http://edge_cms;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
